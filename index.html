<!-- =========================
     SIGN UP
========================= -->

<section id="signup" class="page-section">

  <div class="form-card">

    <h2>Create SCF Account</h2>

    <p class="form-subtitle">
      Start your SCF journey
    </p>

    <form onsubmit="registerUser(event)">

      <label for="fullName">
        Full Name
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        required
      >


      <label for="phone">
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="e.g. 07XXXXXXXX"
        required
      >


      <label for="email">
        Gmail
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your Gmail"
        required
      >


      <label for="whatsapp">
        WhatsApp Number
      </label>

      <input
        type="tel"
        id="whatsapp"
        placeholder="Enter your WhatsApp number"
        required
      >


      <!-- =========================
           REFERRAL CODE
      ========================== -->

      <label for="referralCode">
        Referral Code
        <span style="opacity:0.7;">(Optional)</span>
      </label>

      <input
        type="text"
        id="referralCode"
        placeholder="e.g. SCF-8A71F2C9"
        autocomplete="off"
      >

      <p class="small-text">
        Have an SCF referral code? Enter it here.
      </p>


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        required
      >


      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        required
      >


      <button
        type="submit"
        class="primary-button full-button"
      >
        Create Account
      </button>

    </form>

    <p class="form-footer">
      Already have an account?

      <button
        class="text-button"
        onclick="showSection('login')"
      >
        Login
      </button>
    </p>

  </div>

</section>
